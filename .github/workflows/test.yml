# make test on every push and pull request, signed ad-hoc like any fresh clone.
name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - run: brew install xcodegen
      - run: xcodebuild -version
      - run: make test
      # The English list of every piece of text is written by `make strings`, never by hand (TRANSLATING.md).
      - name: English list is current
        run: make strings && git diff --exit-code Resources/en.lproj
      # On a pull request, the app itself, for a translator to try their language without building it.
      - name: App for this pull request
        if: github.event_name == 'pull_request'
        run: make release RELEASE_IDENTITY=-
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: Copperlight
          path: build/Copperlight.zip
      # The quiet log names the failing tests only; this prints each failed check, with its values.
      - name: Failed checks
        if: failure()
        run: >
          xcrun xcresulttool get test-results tests --path "$(ls -td build/Logs/Test/*.xcresult | head -1)" |
          python3 -c 'import json, sys; f = lambda n: ([n["name"]] if n.get("nodeType") == "Failure Message" else []) + [m for c in n.get("children", []) for m in f(c)]; print("\n".join(m for t in json.load(sys.stdin)["testNodes"] for m in f(t)))'
